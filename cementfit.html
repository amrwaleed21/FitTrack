t-size:.75rem;font-weight:800;margin-top:2px}.cart-item-controls{display:flex;align-items:center;gap:7px;flex-shrink:0}.qty-btn{width:27px;height:27px;border:0;border-radius:7px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}.cart-summary{border-top:1px solid var(--border);padding-top:15px;display:flex;flex-direction:column;gap:9px}.cart-shipping-row,.cart-total-row{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:#999}.cart-total-row{font-size:.95rem;font-weight:900;color:white;border-top:1px dashed var(--border);padding-top:10px}.btn-checkout-whatsapp{background:#25d366;color:white;text-align:center;padding:12px;border-radius:12px;text-decoration:none;font-weight:900;display:flex;align-items:center;justify-content:center;gap:9px;font-size:.88rem;margin-top:5px}

<script>
const SUPABASE_URL = 'https://mhdprpqckntptvgsmnlo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0qMAGKpfoQpHa5FoO-lNLg_5OIc2Kn_';

const DEFAULT_IMAGE = 'https://via.placeholder.com/500x350?text=CementFit';
let productsData = [];
let cart = [];
let currentCategory = 'all';
let toastTimeout = null;

try {
    const savedCart = JSON.parse(localStorage.getItem('cementfit_cart') || '[]');
    cart = Array.isArray(savedCart) ? savedCart : [];
} catch (error) {
    cart = [];
}

function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[ch]));
}

function safeImageUrl(value) {
    if (!value) return DEFAULT_IMAGE;
    try {
        const url = new URL(value, window.location.href);
        return ['https:', 'http:'].includes(url.protocol) ? url.href : DEFAULT_IMAGE;
    } catch (error) {
        return DEFAULT_IMAGE;
    }
}

function showToast(message) {
    const toast = document.getElementById('toastNotification');
    document.getElementById('toastText').textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

async function loadProducts() {
    const container = document.getElementById('products-container');
    container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">جاري تحميل المنتجات...</p>';

    try {
        // Use Supabase REST API directly; this does not depend on an external JS library/CDN.
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        let response;
        try {
            response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.desc`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Accept': 'application/json'
                },
                signal: controller.signal
            });
        } finally {
            clearTimeout(timeoutId);
        }

        if (!response.ok) {
            const details = await response.text().catch(() => '');
            console.error('Supabase REST error:', response.status, details);
            container.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#ef4444;padding:40px;line-height:2">تعذّر تحميل المنتجات (HTTP ${response.status}).<br>تأكد من اتصال الإنترنت وصلاحيات قراءة جدول المنتجات في Supabase.</div>`;
            return;
        }

        const products = await response.json();
        if (!Array.isArray(products)) throw new Error('Unexpected products response');
        productsData = products;
        filterProducts();
        updateCartUI();
    } catch (error) {
        console.error('Failed to load products:', error);
        const message = error.name === 'AbortError'
            ? 'انتهت مهلة الاتصال بقاعدة البيانات.'
            : 'تعذّر الاتصال بقاعدة البيانات. تأكد من الإنترنت ثم حدّث الصفحة.';
        container.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#ef4444;padding:40px;line-height:2">${message}<br>لو استمرت المشكلة، ابعتلي صورة الرسالة.</div>`;
    }
}

function goToProduct(id) {
    window.location.href = `cementfit-product.html?id=${encodeURIComponent(String(id))}`;
}

function renderProducts(list) {
    const container = document.getElementById('products-container');
    container.innerHTML = '';

    if (!list.length) {
        container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:45px 10px">لا توجد منتجات مطابقة لعملية البحث أو الفلترة.</p>';
        return;
    }

    list.forEach((prod, index) => {
        const oldPrice = Number(prod.old_price);
        const price = Number(prod.price) || 0;
        const hasDiscount = oldPrice > price;
        const discount = hasDiscount ? Math.round(((oldPrice - price) / oldPrice) * 100) : 0;
        const card = document.createElement('article');
        card.className = 'product-card';
        card.style.animationDelay = `${index * 0.04}s`;
        card.tabIndex = 0;
        card.setAttribute('role', 'link');
        card.setAttribute('aria-label', `تفاصيل ${prod.name || 'المنتج'}`);
        card.addEventListener('click', () => goToProduct(prod.id));
        card.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                goToProduct(prod.id);
            }
        });

        const badge = hasDiscount ? `<div class="discount-badge">خصم ${discount}%</div>` : '';
        const oldPriceHTML = hasDiscount ? `<span class="old-price">${oldPrice.toLocaleString('en-US')} ج.م</span>` : '';
        card.innerHTML = `
            ${badge}
            <img src="${escapeHTML(prod.image || DEFAULT_IMAGE)}" alt="${escapeHTML(prod.name || 'المنتج')}" class="product-img" loading="lazy">
            <div class="product-info">
                <h3 class="product-name">${escapeHTML(prod.name || 'منتج CEMENTFIT')}</h3>
                <p class="product-desc">${escapeHTML(prod.desc || 'منتج عالي الجودة من CEMENTFIT.')}</p>
                <div class="product-footer">
                    <div class="price-container"><span class="price">${price.toLocaleString('en-US')} ج.م</span>${oldPriceHTML}</div>
                    <button type="button" class="btn-add-cart"><i class="fa-solid fa-cart-plus"></i> أضف للسلة</button>
                </div>
            </div>`;

        const img = card.querySelector('.product-img');
        img.addEventListener('error', () => { img.src = DEFAULT_IMAGE; }, { once: true });
        card.querySelector('.btn-add-cart').addEventListener('click', event => {
            event.stopPropagation();
            addToCart(prod.id);
        });
        container.appendChild(card);
    });
}

function filterProducts() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const sortVal = document.getElementById('sortSelect').value;

    let filtered = productsData.filter(product => {
        const name = String(product.name || '').toLowerCase();
        const desc = String(product.desc || '').toLowerCase();
        const matchesSearch = name.includes(query) || desc.includes(query);
        const category = currentCategory.toLowerCase();
        const matchesCategory = category === 'all' || name.includes(category) || desc.includes(category);
        return matchesSearch && matchesCategory;
    });

    if (sortVal === 'low-high') filtered.sort((a,b) => Number(a.price) - Number(b.price));
    if (sortVal === 'high-low') filtered.sort((a,b) => Number(b.price) - Number(a.price));
    renderProducts(filtered);
}

function setCategory(category, button) {
    currentCategory = category;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');
    filterProducts();
}

function saveCart() {
    localStorage.setItem('cementfit_cart', JSON.stringify(cart));
}

function addToCart(id) {
    const product = productsData.find(item => String(item.id) === String(id));
    if (!product) return;

    const existing = cart.find(item => String(item.id) === String(id));
    if (existing) existing.qty = (Number(existing.qty) || 0) + 1;
    else cart.push({ ...product, qty: 1 });

    saveCart();
    updateCartUI();
    showToast(`تم إضافة "${product.name}" للسلة بنجاح`);
}

function changeQty(id, delta) {
    const item = cart.find(product => String(product.id) === String(id));
    if (!item) return;

    item.qty = (Number(item.qty) || 0) + delta;
    if (item.qty <= 0) cart = cart.filter(product => String(product.id) !== String(id));

    saveCart();
    updateCartUI();
}

function updateCartUI() {
    saveCart();
    document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);

    const itemsContainer = document.getElementById('cartItemsContainer');
    itemsContainer.innerHTML = '';

    if (!cart.length) {
        itemsContainer.innerHTML = '<p style="text-align:center;color:var(--muted);margin:30px 0">السلة فارغة حالياً</p>';
        document.getElementById('cartShippingPriceVal').textContent = '0 ج.م';
        document.getElementById('cartShippingLoc').textContent = 'لا يوجد';
        document.getElementById('cartTotalPrice').textContent = '0 ج.م';
        document.getElementById('whatsappCheckoutBtn').href = '#';
        return;
    }

    let productsTotal = 0;
    let maxShipping = 0;
    let shippingLocation = 'حسب المتفق عليه';
    let orderText = 'السلام عليكم،\nممكن اطلب:\n';

    cart.forEach(item => {
        const qty = Number(item.qty) || 1;
        const price = Number(item.price) || 0;
        productsTotal += price * qty;
        orderText += `${item.name} - الكمية: ${qty} - السعر: ${price} ج.م\n`;

        const shipping = Number(item.shipping_price) || 0;
        if (shipping > maxShipping) {
            maxShipping = shipping;
            shippingLocation = item.shipping_locations || 'جميع المحافظات';
        }

        const row = document.createElement('div');
        row.className = 'cart-item';
        const details = document.createElement('div');
        details.className = 'cart-item-details';
        const name = document.createElement('h4');
        name.textContent = item.name;
        const line = document.createElement('p');
        line.textContent = `${price.toLocaleString('en-US')} ج.م × ${qty}`;
        details.append(name, line);

        const controls = document.createElement('div');
        controls.className = 'cart-item-controls';
        const minus = document.createElement('button');
        minus.className = 'qty-btn';
        minus.textContent = '−';
        minus.setAttribute('aria-label', 'تقليل الكمية');
        minus.addEventListener('click', () => changeQty(item.id, -1));
        const count = document.createElement('span');
        count.style.fontWeight = '800';
        count.textContent = qty;
        const plus = document.createElement('button');
        plus.className = 'qty-btn';
        plus.textContent = '+';
        plus.setAttribute('aria-label', 'زيادة الكمية');
        plus.addEventListener('click', () => changeQty(item.id, 1));
        controls.append(minus, count, plus);
        row.append(details, controls);
        itemsContainer.appendChild(row);
    });

    document.getElementById('cartShippingPriceVal').textContent = `${maxShipping.toLocaleString('en-US')} ج.م`;
    document.getElementById('cartShippingLoc').textContent = shippingLocation;
    document.getElementById('cartTotalPrice').textContent = `${(productsTotal + maxShipping).toLocaleString('en-US')} ج.م`;
    document.getElementById('whatsappCheckoutBtn').href =
        `https://wa.me/201212338084?text=${encodeURIComponent(orderText + `الشحن: ${maxShipping} ج.م\nالإجمالي: ${productsTotal + maxShipping} ج.م`)}`;
}

function openCartModal() {
    updateCartUI();
    document.getElementById('cartModal').classList.add('active');
}

function closeModal(event) {
    if (event.target.classList.contains('modal-overlay')) event.target.classList.remove('active');
}

function forceCloseModal(id) {
    document.getElementById(id).classList.remove('active');
}

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(modal => modal.classList.remove('active'));
});

loadProducts();

</script>
</body>
</html>
